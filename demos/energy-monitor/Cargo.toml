[package]
name = "energy-monitor"
version = "1.17.1"
authors = ["Slint Developers <info@slint.dev>"]
edition.workspace = true
build = "build.rs"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
slint = { path = "../../api/rs/slint", default-features = false, features = ["compat-1-2"] }
mcu-board-support = { path = "../../examples/mcu-board-support", optional = true }
chrono = { version = "0.4.34", optional = true, default-features = false, features = ["clock", "std", "wasmbind"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
tokio = { version = "1.25", optional = true, features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2" }
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1.5"

[build-dependencies]
slint-build = { path = "../../api/rs/build" }

[features]
default = ["slint/default", "network", "chrono", "slint/backend-android-activity-06"]
simulator = ["mcu-board-support", "slint/renderer-software", "slint/backend-winit", "slint/std"]
network = ["dep:reqwest", "dep:serde", "tokio"]
## sgc fork: fullscreen on an @sgc DRM lease via the linuxsgc backend, with
## pointer/keyboard/touch from the daemon-granted devices (libinput). Board
## builds (dynamically linked gnu; libinput + xkbcommon are runtime deps):
##   software (CPU):  --no-default-features --features "sgc,chrono"
##   gl (femtovg):    --no-default-features --features "sgc-femtovg,chrono"
##                    (Mali/panfrost: needs mesa libgbm/EGL/GLES on the board)
sgc-base = ["slint/backend-linuxsgc", "slint/backend-linuxsgc-libinput", "slint/std"]
sgc = ["sgc-base", "slint/renderer-software"]
sgc-femtovg = ["sgc-base", "slint/renderer-femtovg"]
