# cSpell: ignore memmap xkbcommon sgc
#
# sgc fork of the linuxkms backend (WIP, sgc-lease-1.17): copy of the 1.17
# release branch's i-slint-backend-linuxkms, trimmed to Linux and to the
# renderers we use (software + femtovg GL), with sgc-specific changes:
#   - the backend OWNS its sgc session: Backend::build connects to the @sgc
#     daemon, acquires a DRM card lease and renders on it (sgc or die: no
#     direct /dev/dri open, no fbdev fallback); the event loop pumps the
#     session — revoke suspends rendering, re-grant rebuilds the display
#     stack (software renderer; the GL stack cannot be rebuilt in-process
#     and the process exits with an error when preempted)
#   - fontique fontconfig-dlopen baked in (no libfontconfig link-time dep,
#     keeps fully static musl builds possible)
#   - input handling (libinput) is OPT-IN here (upstream 1.17 had it
#     unconditional, dragging libudev into every build); enable `libinput` when
#     input support is needed. No libseat anywhere: this backend renders on an
#     sgc lease and opens /dev/input directly.
# Keep the upstream linuxkms crate pristine so syncing stays conflict-free; do
# NOT port changes back into i-slint-backend-linuxkms.
[package]
name = "i-slint-backend-linuxsgc"
description = "slint backend (sgc fork, Linux): fullscreen UI on a DRM lease granted by the simple-graphics-controller daemon"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "lib.rs"

[features]
# Render on the DRM device with OpenGL via gbm/EGL (needs the GPU mesa stack).
renderer-femtovg = ["i-slint-renderer-femtovg/opengl", "drm", "gbm", "glutin", "raw-window-handle"]
# CPU rendering into dumb buffers / fbdev — the only renderer that builds fully
# static musl (no gbm/EGL linkage).
renderer-software = ["i-slint-renderer-software/std", "drm", "dep:bytemuck", "dep:memmap2"]
## Handle mouse, touch and keyboard input via libinput. Without this feature the
## backend renders but receives no input events (and libinput, libudev and
## libxkbcommon are not needed at build or run time). No libseat: we run as root
## (or render on an sgc lease fd), so libinput opens /dev/input directly.
libinput = ["dep:input", "dep:xkbcommon"]

default = []

[dependencies]
i-slint-core = { workspace = true, features = ["default", "image-decoders", "svg"] }
i-slint-common = { workspace = true, features = ["default"] }
i-slint-renderer-femtovg = { workspace = true, features = ["default"], optional = true }
i-slint-renderer-software = { workspace = true, optional = true }
# sgc: the backend drives its own session against the simple-graphics-controller
# daemon (connect @sgc, acquire the card lease, pump revoke/re-grant). The
# client library lives in its own repo and is fetched as a git ref.
libsgc-rs = { git = "https://github.com/lulkien/libsgc-rs.git" }

[target.'cfg(target_os = "linux")'.dependencies]
input = { workspace = true, default-features = true, optional = true }
xkbcommon = { version = "0.9.0", optional = true }
calloop = { version = "0.14.1" }
nix = { version = "0.31.0", features = ["fs", "ioctl"] }
# sgc: fontique depends on yeslogic-fontconfig-sys, which pkg-config-links
# libfontconfig on Linux — impossible for fully static musl builds. Flip the
# crate's `fontconfig-dlopen` feature (unified across the whole dependency
# graph) so fontconfig is dlopened at runtime instead of linked.
fontique = { workspace = true, features = ["fontconfig-dlopen"] }
# Keep in sync with the drm version used by gbm
drm = { version = "0.14.0", optional = true }
gbm = { version = "0.18.0", optional = true, default-features = false, features = ["drm-support"] }
glutin = { workspace = true, optional = true, default-features = false, features = ["libloading", "egl"] }
raw-window-handle = { version = "0.6.2", optional = true }
bytemuck = { workspace = true, optional = true, features = ["derive"] }
memmap2 = { version = "0.9.4", optional = true }

[build-dependencies]
cfg_aliases = { workspace = true }

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]
